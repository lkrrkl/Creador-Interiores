<title>Creador de Interiores Isométrico</title>
<style>
:root{--bg:#fdf8f2;--fg:#2b2b33;--pn:#fffffff2;--bd:#e0d6c6;--ac:#e0605f;color-scheme:light}

*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:13px system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.bar{position:fixed;display:flex;gap:6px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:6px;z-index:5}
#lb,#rb{top:calc(50% + 33px);transform:translateY(-50%);flex-direction:column;max-height:calc(100vh - 130px);overflow-y:auto}
#lb{left:calc(8px + env(safe-area-inset-left,0px))}#rb{right:calc(8px + env(safe-area-inset-right,0px))}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid transparent;border-radius:9px;cursor:pointer;min-width:38px;height:38px;font-size:19px;padding:0 6px}
button.on{background:var(--ac);color:#fff}button:hover{border-color:var(--bd)}
#cb{left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 130px);flex-wrap:wrap;align-items:center;justify-content:center}
.sw{width:24px;height:24px;min-width:24px;border-radius:6px;border:2px solid var(--bd);padding:0}.sw.on{border-color:var(--fg)}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--bd);border-radius:6px;background:none}
select,#cb button{font-size:13px;height:30px}select{background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:8px}
#pop{position:fixed;left:calc(64px + env(safe-area-inset-left,0px));top:calc(50% + 33px);transform:translateY(-50%);width:min(330px,calc(100vw - 140px));max-height:calc(100vh - 140px);display:flex;flex-direction:column;gap:6px;z-index:6;flex-wrap:nowrap}
#tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:3px}#tabs button{font-size:12px;height:28px;white-space:nowrap;border-color:var(--bd)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:5px;overflow:auto}
#grid button{height:auto;display:flex;flex-direction:column;align-items:center;font-size:10px;line-height:1.1;padding:3px;border-color:var(--bd)}
#grid canvas{position:static;width:56px;height:56px}
#st{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
#st h1{margin:0;font-size:26px}.card{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.card button{height:auto;width:150px;padding:16px 8px;font-size:15px;border:2px solid var(--bd);background:var(--pn)}.card button b{display:block;font-size:30px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;padding:6px 12px;border-radius:10px;z-index:30;display:none}
#hd{position:fixed;top:0;left:0;right:0;z-index:7;display:flex;flex-direction:column;align-items:center;gap:3px;padding:calc(4px + env(safe-area-inset-top,0px)) 8px 5px;background:var(--pn);border-bottom:1px solid var(--bd)}
#ttl{font-weight:700;font-size:16px}#sub{display:flex;gap:8px;align-items:center;font-size:13px}#sub input{font:inherit;width:140px;height:28px;padding:0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg)}
#sub button{height:30px;min-width:36px;font-size:17px;border-color:var(--bd)}
#md{position:fixed;inset:0;background:#0006;z-index:40;display:none;align-items:center;justify-content:center}#md .bx{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:18px;max-width:320px;text-align:center;font-size:14px}#md button{border:1px solid var(--bd);font-size:14px;padding:0 16px;margin:10px 4px 0}
@media (max-height:720px){#lb button,#rb button{height:33px;min-width:33px;font-size:17px}}
